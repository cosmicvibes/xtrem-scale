name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        # Orchestra Testbench 8 / 9 / 10 / 11 target Laravel 10 / 11 / 12 / 13 respectively.
        testbench: ['^8.0', '^9.0', '^10.0', '^11.0']
        exclude:
          # Laravel 13 (Testbench 11) requires PHP 8.3+.
          - php: '8.2'
            testbench: '^11.0'

    name: PHP ${{ matrix.php }} — testbench ${{ matrix.testbench }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sockets
          coverage: none

      - name: Install dependencies
        run: |
          composer require "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run test suite
        run: vendor/bin/phpunit
